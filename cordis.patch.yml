# dsh-token-usage-hud bundle patch.
#
# Inserts the plugin row into the profile loader. The row id must stay unique
# across every bundle layer; the name must be the package name (the loader and
# the client-module scanner resolve the package by this name).
#
# Config keys:
#   enabled     - host half off switch (route + event fold). Default true.
#   currency    - "CNY" (default) or "USD"; only affects how cost is labeled.
#   pollMs      - client overlay refresh interval in ms. Default 1500.
#   position    - "top-right" (default) | "top-center" | "bottom-right".
#   visible     - client overlay initially visible. Default true.
#   prices      - per-model cost table, per 1M tokens. Each entry is either
#                 the flat form {input, cacheRead, cacheWrite, output} (both
#                 billing periods priced equally) or the DeepSeek V4 form
#                 {peak: {...}, offpeak: {...}} (a missing period mirrors the
#                 other). "default" covers unknown models. cacheWrite falls
#                 back to cacheRead when omitted.
#
# Peak hours (Beijing time): Mon-Fri 09:00-12:00 and 14:00-18:00; off-peak is
# exactly half the peak price. Official source:
# https://api-docs.deepseek.com/zh-cn/quick_start/pricing/
#
#   balance     - account balance display (DeepSeek GET /user/balance):
#     enabled   - host half off switch. Default true.
#     refreshMs - idle cache/refresh interval in ms, >= 5000. Default 15000.
#     refetchFloorMs - minimum interval between balance requests while the
#                 conversation is actively consuming (usage events invalidate
#                 the cache so the next poll refetches). >= 1000, capped at
#                 refreshMs. Default 5000.
#     apiKeyEnv - credential ref resolved through the credentials service
#                 (env-inherited managed store); never leaves the host.
#                 Default DEEPSEEK_API_KEY.
#     baseURL   - DeepSeek API origin. Default https://api.deepseek.com

- insert:
    - id: dsh-token-usage-hud
      name: 'dsh-token-usage-hud'
      config:
        enabled: true
        currency: CNY
        pollMs: 1500
        position: top-right
        visible: true
        # 桌面端（Electron/WebView 等自定义协议壳）的 host 地址。留空 = 自动：
        # 优先页面同源（Web 端），失败时回退 http://127.0.0.1:3080。仅当页面
        # 来源不是本机 host 且端口非 3080 时才需要显式填写。
        hostURL: ''
        # 中国法定节假日（北京时间 YYYY-MM-DD）：全天按空闲价计费。
        # 例：["2026-10-01", "2026-10-02", "2026-10-03"]
        offpeakDates: []
        balance:
          enabled: true
          refreshMs: 15000
          refetchFloorMs: 5000
          apiKeyEnv: DEEPSEEK_API_KEY
          baseURL: https://api.deepseek.com
        prices:
          # deepseek-flash（现役官方模型名；旧名 deepseek-v4-flash /
          # deepseek-v4-flash-vision-exp 仍可调用，由 DeepSeek-V4.1-Flash
          # 提供服务并同样按 Flash 价格计费）
          default:
            peak:
              input: 2
              cacheRead: 0.04
              cacheWrite: 2
              output: 8
            offpeak:
              input: 1
              cacheRead: 0.02
              cacheWrite: 1
              output: 4
          deepseek-flash:
            peak:
              input: 2
              cacheRead: 0.04
              cacheWrite: 2
              output: 8
            offpeak:
              input: 1
              cacheRead: 0.02
              cacheWrite: 1
              output: 4
          deepseek-v4-flash:
            peak:
              input: 2
              cacheRead: 0.04
              cacheWrite: 2
              output: 8
            offpeak:
              input: 1
              cacheRead: 0.02
              cacheWrite: 1
              output: 4
          deepseek-v4-flash-vision-exp:
            peak:
              input: 2
              cacheRead: 0.04
              cacheWrite: 2
              output: 8
            offpeak:
              input: 1
              cacheRead: 0.02
              cacheWrite: 1
              output: 4
          deepseek-v4-pro:
            peak:
              input: 9.0
              cacheRead: 0.30
              cacheWrite: 9.0
              output: 27.0
            offpeak:
              input: 4.5
              cacheRead: 0.15
              cacheWrite: 4.5
              output: 13.5
          # 旧一代模型（兼容保留；单档即两时段同价）
          deepseek-chat:
            input: 2
            cacheRead: 0.5
            cacheWrite: 2
            output: 8
          deepseek-reasoner:
            input: 4
            cacheRead: 1
            cacheWrite: 4
            output: 16
